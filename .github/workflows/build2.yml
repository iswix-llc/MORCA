name: Build (Linux)

# Experimental: everything on ubuntu-latest, including the MAUI Windows publish and Authenticode signing.
# Known risks: (1) the WinUI XAML compile may not work off Windows, (2) 'sign' may not support .msi off Windows.
# The 'sign' dotnet tool and its 'trusted-signing' subcommand name may be renamed in newer releases; check 'sign code --help'.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # MORCA.csproj only adds the -windows TFM on Windows; a global property overrides that.
  WIN_TFM: net10.0-windows10.0.19041.0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 'maui' and 'maui-windows' are not installable on Linux. 'maui-android' is, and it brings the
      # MAUI SDK manifest; the Windows packs are then expected to restore from NuGet (unverified).
      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Compute version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Publish app (self-contained, unpackaged, win-x64)
        run: >
          dotnet publish Application/MORCA/MORCA.csproj
          -f ${{ env.WIN_TFM }}
          -p:TargetFrameworks=${{ env.WIN_TFM }}
          -p:EnableWindowsTargeting=true
          -p:PublishProfile=win-x64
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install sign CLI
        run: dotnet tool install --global sign --prerelease

      - name: Sign MORCA.exe
        run: >
          sign code trusted-signing
          --base-directory "$GITHUB_WORKSPACE/Installer/Deploy/App"
          --trusted-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}"
          --trusted-signing-account "${{ vars.SIGNING_ACCOUNT }}"
          --trusted-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}"
          --file-digest SHA256
          --timestamp-url http://timestamp.acs.microsoft.com
          --timestamp-digest SHA256
          "*.exe"

      - name: Build MSI (managed WiX backend)
        run: >
          dotnet build Installer/MORCA/MORCA.iswixproj
          -c Release -p:Platform=x64
          -p:MSIProductVersion=${{ steps.version.outputs.version }}

      - name: Sign MSI
        run: >
          sign code trusted-signing
          --base-directory "$GITHUB_WORKSPACE/Installer/MORCA/bin/x64/Release"
          --trusted-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}"
          --trusted-signing-account "${{ vars.SIGNING_ACCOUNT }}"
          --trusted-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}"
          --file-digest SHA256
          --timestamp-url http://timestamp.acs.microsoft.com
          --timestamp-digest SHA256
          "*.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MORCA-msi-${{ steps.version.outputs.version }}
          path: Installer/MORCA/bin/x64/Release/*.msi
          if-no-files-found: error

      - name: Draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Installer/MORCA/bin/x64/Release/*.msi
